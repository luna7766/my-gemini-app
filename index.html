<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 창작 스튜디오</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --accent: #2563eb;
      --border: #e2e8f0;
      --user-bubble: #eff6ff;
      --ai-bubble: #f1f5f9;
      --btn-secondary-hover: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0.5rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 92vh;
    }

    .header {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: #fafafa;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .header-top h1 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .action-buttons {
      display: flex;
      gap: 0.4rem;
    }

    .btn-action {
      padding: 0.4rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .btn-action:hover {
      background: var(--btn-secondary-hover);
    }

    .btn-action.reset {
      color: var(--danger);
      border-color: #fca5a5;
    }

    .settings-bar {
      display: flex;
      gap: 0.4rem;
    }

    .settings-bar select, .settings-bar input {
      padding: 0.5rem 0.65rem;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
    }

    .settings-bar input {
      flex: 1;
    }

    /* 작품 기본틀 (시스템 프롬프트) 영역 */
    .system-box {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed var(--border);
    }

    .system-box.open {
      display: flex;
    }

    .system-box label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
      display: flex;
      justify-content: space-between;
    }

    .system-box textarea {
      width: 100%;
      height: 110px;
      padding: 0.6rem;
      font-size: 0.85rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fffbeb;
      line-height: 1.4;
      resize: vertical;
    }

    .chat-box {
      flex: 1;
      padding: 1.2rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 85%;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #1e40af;
      border-bottom-right-radius: 2px;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai-bubble);
      border-bottom-left-radius: 2px;
    }

    .message.system-notice {
      align-self: center;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .input-area {
      padding: 0.9rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      background: #fafafa;
    }

    .input-area textarea {
      flex: 1;
      resize: vertical;
      min-height: 60px;
      max-height: 180px;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.45;
      outline: none;
    }

    .btn-send {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 1.2rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-send:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-top">
        <h1>Gemini 창작 스튜디오</h1>
        <div class="action-buttons">
          <button id="toggleSysBtn" class="btn-action">✍️ 기본틀 설정</button>
          <button id="copyBtn" class="btn-action">📋 복사</button>
          <button id="resetBtn" class="btn-action reset">🔄 초기화</button>
        </div>
      </div>

      <div class="settings-bar">
        <select id="modelSelect">
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (장편/고성능)</option>
        </select>
        <input type="password" id="apiKey" placeholder="API 키 입력" />
      </div>

      <!-- 작품 기본틀 고정 입력창 -->
      <div class="system-box" id="systemBox">
        <label>
          <span>📌 작품 기본틀 고정 (System Instruction - 대화 내내 유지됨)</span>
          <span>창의성(Temp): <input type="number" id="tempInput" value="1.0" step="0.1" min="0" max="2" style="width:50px; padding:2px 4px; font-size:0.75rem;"></span>
        </label>
        <textarea id="systemPrompt" placeholder="예: 당신은 로맨스 판타지 소설가입니다.&#10;- 시점: 1인칭 주인공 시점&#10;- 문체: 섬세하고 감각적인 묘사, 서정적인 분위기&#10;- 등장인물: 리안(냉철한 북부 대공), 엘레나(몰락한 귀족 영애)&#10;- 규칙: 설명조의 요약을 피하고 대사와 행동 묘사로 장면을 길게 전개할 것."></textarea>
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <textarea id="promptInput" placeholder="장면 지시나 원고 내용을 입력하세요 (줄바꿈: Enter, 전송: Ctrl+Enter 또는 전송버튼)"></textarea>
      <button id="sendBtn" class="btn-send">전송</button>
    </div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    const apiKeyInput = document.getElementById("apiKey");
    const modelSelect = document.getElementById("modelSelect");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatBox = document.getElementById("chatBox");
    const copyBtn = document.getElementById("copyBtn");
    const resetBtn = document.getElementById("resetBtn");
    const toggleSysBtn = document.getElementById("toggleSysBtn");
    const systemBox = document.getElementById("systemBox");
    const systemPrompt = document.getElementById("systemPrompt");
    const tempInput = document.getElementById("tempInput");

    const STORAGE_KEY_API = "gemini_api_key";
    const STORAGE_KEY_MODEL = "gemini_selected_model";
    const STORAGE_KEY_HISTORY = "gemini_chat_history";
    const STORAGE_KEY_SYSTEM = "gemini_system_prompt";
    const STORAGE_KEY_TEMP = "gemini_temperature";

    let conversationHistory = [];

    // 저장된 설정 복원
    if (localStorage.getItem(STORAGE_KEY_API)) apiKeyInput.value = localStorage.getItem(STORAGE_KEY_API);
    if (localStorage.getItem(STORAGE_KEY_MODEL)) modelSelect.value = localStorage.getItem(STORAGE_KEY_MODEL);
    if (localStorage.getItem(STORAGE_KEY_SYSTEM)) systemPrompt.value = localStorage.getItem(STORAGE_KEY_SYSTEM);
    if (localStorage.getItem(STORAGE_KEY_TEMP)) tempInput.value = localStorage.getItem(STORAGE_KEY_TEMP);

    try {
      const saved = localStorage.getItem(STORAGE_KEY_HISTORY);
      if (saved) conversationHistory = JSON.parse(saved);
    } catch (e) {
      conversationHistory = [];
    }

    // 기본틀 설정창 열기/닫기
    toggleSysBtn.addEventListener("click", () => {
      systemBox.classList.toggle("open");
    });

    apiKeyInput.addEventListener("change", () => localStorage.setItem(STORAGE_KEY_API, apiKeyInput.value.trim()));
    modelSelect.addEventListener("change", () => localStorage.setItem(STORAGE_KEY_MODEL, modelSelect.value));
    systemPrompt.addEventListener("input", () => localStorage.setItem(STORAGE_KEY_SYSTEM, systemPrompt.value));
    tempInput.addEventListener("change", () => localStorage.setItem(STORAGE_KEY_TEMP, tempInput.value));

    function renderAllMessages() {
      chatBox.innerHTML = "";
      if (conversationHistory.length === 0) {
        const notice = document.createElement("div");
        notice.className = "message system-notice";
        notice.textContent = "상단 [✍️ 기본틀 설정]에서 세계관과 문체를 고정하고 집필을 시작해 보세요!";
        chatBox.appendChild(notice);
        return;
      }
      conversationHistory.forEach(item => {
        renderBubble(item.text, item.role === "user" ? "user" : "ai");
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderBubble(text, roleClass) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${roleClass}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      return msgDiv;
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(conversationHistory));
    }

    copyBtn.addEventListener("click", async () => {
      if (!conversationHistory.length) return alert("복사할 내용이 없습니다.");
      const text = conversationHistory.map(i => `[${i.role === "user" ? "지시" : "원고"}]\n${i.text}\n`).join("\n");
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "✓ 복사됨";
      setTimeout(() => copyBtn.textContent = "📋 복사", 1500);
    });

    resetBtn.addEventListener("click", () => {
      if (!conversationHistory.length) return;
      if (confirm("대화 내역을 초기화할까요? (작품 기본틀 설정은 그대로 유지됩니다)")) {
        conversationHistory = [];
        localStorage.removeItem(STORAGE_KEY_HISTORY);
        renderAllMessages();
      }
    });

    async function handleSend() {
      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();
      const selectedModel = modelSelect.value;
      const sysInstruction = systemPrompt.value.trim();
      const temperature = parseFloat(tempInput.value) || 1.0;

      if (!apiKey) return alert("API 키를 입력해주세요.");
      if (!prompt) return;

      const notice = chatBox.querySelector(".system-notice");
      if (notice) notice.remove();

      conversationHistory.push({ role: "user", text: prompt });
      renderBubble(prompt, "user");
      saveHistory();

      promptInput.value = "";
      sendBtn.disabled = true;

      const aiBubble = renderBubble("...", "ai");
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const ai = new GoogleGenAI({ apiKey });

        const safetySettings = [
          { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
          { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
        ];

        const contentsPayload = conversationHistory.map(item => ({
          role: item.role,
          parts: [{ text: item.text }]
        }));

        const configObj = {
          safetySettings,
          temperature,
        };

        // 기본틀(시스템 프롬프트) 고정
        if (sysInstruction) {
          configObj.systemInstruction = sysInstruction;
        }

        const responseStream = await ai.models.generateContentStream({
          model: selectedModel,
          contents: contentsPayload,
          config: configObj,
        });

        let fullAiText = "";
        aiBubble.textContent = "";

        for await (const chunk of responseStream) {
          if (chunk.text) {
            fullAiText += chunk.text;
            aiBubble.textContent = fullAiText;
            chatBox.scrollTop = chatBox.scrollHeight;
          }
        }

        conversationHistory.push({ role: "model", text: fullAiText });
        saveHistory();

      } catch (error) {
        aiBubble.textContent = `오류: ${error.message}`;
        conversationHistory.pop();
        saveHistory();
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    sendBtn.addEventListener("click", handleSend);

    // 📌 변경된 키 이벤트: 단순 Enter는 자유롭게 줄바꿈, Ctrl+Enter 또는 Cmd+Enter 시 전송
    promptInput.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        handleSend();
      }
    });

    renderAllMessages();
  </script>
</body>
</html>
